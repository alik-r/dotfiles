# ~/.config/tmux/tmux.conf  (symlinked from ~/dotfiles/tmux/tmux.conf)
# Reload: prefix r

# --- prefix: Ctrl+a (press Ctrl+a twice to send it to the shell, e.g. line start) ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- basics ---
set -g mouse on                     # click panes, drag borders, scroll
set -g base-index 1                 # windows start at 1 (matches keyboard)
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10              # no Esc delay in nvim
set -g focus-events on              # nvim autoread / gitsigns refresh on focus
set -g display-time 2000
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"  # true color
set -g set-clipboard on             # OSC 52: copy reaches your local clipboard over SSH
set -g allow-passthrough on

# --- copy mode: vi keys (prefix [ to enter, v select, y yank, q quit) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- splits / windows open in the current directory ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Ctrl+h/j/k/l: move between panes AND nvim splits (vim-tmux-navigator) ---
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind C-l send-keys C-l              # Ctrl+l is taken: prefix Ctrl+l clears the shell

# resize panes: prefix + H/J/K/L (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- popups ---
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit     # git UI
bind f display-popup -E -w 60% -h 60% tmux-sessionizer                      # jump to project
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# --- status bar (tokyonight-ish, minimal) ---
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left-length 40
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[default] "
set -g status-right "#[fg=#565f89]#h  %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W "
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#1a1b26,fg=#7aa2f7"
